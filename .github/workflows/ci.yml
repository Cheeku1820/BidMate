name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: takeoff
          POSTGRES_PASSWORD: takeoff
          POSTGRES_DB: takeoff
        options: >-
          --health-cmd "pg_isready -U takeoff"
          --health-interval 3s --health-timeout 3s --health-retries 20
        ports: ["5432:5432"]
      # The same MinIO release this repo has always pinned
      # (RELEASE.2025-04-22T22-12-26Z), from the one registry that still
      # serves it anonymously. Every other source has closed in turn:
      # Docker Hub's minio/minio and minio/mc were pulled in 2025,
      # Bitnami moved its current catalogue behind a paid subscription,
      # and quay.io/minio began answering 401 UNAUTHORIZED to anonymous
      # pulls on every tag -- `latest` included -- around 2026-09-25,
      # which is what broke this job. Bitnami left its pre-subscription
      # images public under `bitnamilegacy`, so this is the same server,
      # same version, reachable again.
      #
      # It runs as a `services:` container, which the old hand-rolled
      # `docker run` could not: that model forwards no command, and
      # minio/minio's entrypoint required one. This image takes its
      # configuration from the environment instead, so the command, the
      # wait loop, and the separate `mc` step all go away -- and a MinIO
      # that never comes up now fails the job before any step runs
      # rather than surfacing later as S3 connection errors.
      minio:
        image: bitnamilegacy/minio:2025.4.22-debian-12-r2
        env:
          MINIO_ROOT_USER: bidmate
          MINIO_ROOT_PASSWORD: bidmate-dev-secret
        options: >-
          --health-cmd "mc ready local"
          --health-interval 3s --health-timeout 3s --health-retries 20
        ports: ["9000:9000"]
    env:
      DATABASE_URL: postgresql+psycopg://takeoff:takeoff@localhost:5432/takeoff
      TEST_DATABASE_URL: postgresql+psycopg://takeoff:takeoff@localhost:5432/takeoff_test
      BLOB_ENDPOINT: http://localhost:9000
      BLOB_ACCESS_KEY: bidmate
      BLOB_SECRET_KEY: bidmate-dev-secret
      BLOB_BUCKET: bidmate-documents
      BLOB_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt
      # boto3 is already a dependency of the thing under test, so the
      # bucket is created with the same client the API uses rather than a
      # second pinned container image that can be withdrawn from under
      # this build -- which is exactly how the `mc` image this replaces
      # failed. Reads the one `env:` block above, so the credentials have
      # a single source. Tolerates an existing bucket so a re-run of this
      # step is a no-op, the way `mc mb --ignore-existing` was.
      - name: Create the documents bucket
        run: |
          python - <<'PY'
          import os
          import boto3
          from botocore.exceptions import ClientError

          bucket = os.environ["BLOB_BUCKET"]
          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["BLOB_ENDPOINT"],
              aws_access_key_id=os.environ["BLOB_ACCESS_KEY"],
              aws_secret_access_key=os.environ["BLOB_SECRET_KEY"],
              region_name=os.environ["BLOB_REGION"],
          )
          try:
              s3.create_bucket(Bucket=bucket)
          except ClientError as exc:
              if exc.response["Error"]["Code"] not in (
                  "BucketAlreadyOwnedByYou", "BucketAlreadyExists",
              ):
                  raise
          print(f"bucket ready: {bucket}")
          PY
      - name: Run migrations
        working-directory: api
        run: alembic upgrade head
      # Proves the worker loop boots against the CI database and polls
      # until killed -- not a functional test (that's the pytest suite
      # below), just that `python -m app.worker` starts cleanly in this
      # environment. `timeout` sends TERM at 20s; the exit status is 124
      # regardless of how main() handles it, so this doesn't depend on
      # graceful shutdown.
      - name: Smoke-test the worker loop
        working-directory: api
        run: timeout 20 python -m app.worker || [ $? -eq 124 ]
      # 0016 was renamed by hand after being applied, and 0017 is DDL-only
      # with a hand-written teardown -- this guards against either kind of
      # migration silently failing to reverse.
      - name: Check the migration chain reverses
        working-directory: api
        run: alembic downgrade -1 && alembic upgrade head
      # This job never sets BIDMATE_BID_SET, so the engine regression tests
      # (test_engine_pipeline.py plus the counting and legend regressions --
      # the guards on a defect that once silently zeroed 43 of 45 items on a
      # real drawing set) skip here. That bid set lives outside the repo and
      # committing it is ruled out by bid confidentiality (ROADMAP.md §3.3).
      # BIDMATE_BID_SET is how a runner with a local copy opts in -- see
      # tests/bid_set.py. -rs prints every skip's reason so a green build
      # here does not read as "the engine was checked."
      - name: Run tests
        working-directory: api
        run: pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 is the floor, not a preference: package.json's test script
          # passes --no-experimental-webstorage in NODE_OPTIONS, which Node
          # 20 rejects outright ("not allowed in NODE_OPTIONS"). Verified
          # across majors: 20 fails, 22 and 24 accept it. Declared in
          # package.json's engines field so this constraint is visible to a
          # reader who never opens this file.
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
