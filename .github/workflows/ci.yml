name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: takeoff
          POSTGRES_PASSWORD: takeoff
          POSTGRES_DB: takeoff
        options: >-
          --health-cmd "pg_isready -U takeoff"
          --health-interval 3s --health-timeout 3s --health-retries 20
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql+psycopg://takeoff:takeoff@localhost:5432/takeoff
      TEST_DATABASE_URL: postgresql+psycopg://takeoff:takeoff@localhost:5432/takeoff_test
      BLOB_ENDPOINT: http://localhost:9000
      BLOB_ACCESS_KEY: bidmate
      BLOB_SECRET_KEY: bidmate-dev-secret
      BLOB_BUCKET: bidmate-documents
      BLOB_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # MinIO does not run here as a `services:` container: that model only
      # forwards `env`/`ports`/`volumes`/`options` to `docker create`, never
      # a command, and the minio/minio image's entrypoint requires one (a
      # bare run prints usage and exits -- verified locally). The commonly
      # suggested fallback, bitnami/minio, is no longer usable either: as of
      # 2025 Bitnami's free images were pulled from Docker Hub behind a paid
      # subscription. Docker Hub's minio/minio and minio/mc are gone too --
      # MinIO now publishes only to quay.io. So MinIO is started by hand,
      # with an explicit `server /data` command, from quay.io.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=bidmate -e MINIO_ROOT_PASSWORD=bidmate-dev-secret \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          # The loop alone could not fail: a MinIO that never came up fell
          # out of it after a minute and the step went green, so the
          # failure surfaced later as a wall of S3 connection errors from
          # the test step rather than here, at the step that caused it.
          for i in $(seq 1 20); do
            if curl -sf http://localhost:9000/minio/health/live; then
              exit 0
            fi
            sleep 3
          done
          echo "MinIO did not answer its health check within 60s" >&2
          docker logs minio >&2 || true
          exit 1
      # The same pinned mc image docker-compose.yml's minio-init uses, run
      # against the runner's network rather than a `curl` of the latest
      # release binary -- an unpinned client beside a pinned server is a
      # build that changes under its own feet.
      - name: Create the documents bucket
        run: |
          docker run --rm --network host --entrypoint /bin/sh \
            quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z -c \
            "mc alias set local http://localhost:9000 bidmate bidmate-dev-secret \
             && mc mb --ignore-existing local/bidmate-documents"
      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt
      - name: Run migrations
        working-directory: api
        run: alembic upgrade head
      # 0016 was renamed by hand after being applied, and 0017 is DDL-only
      # with a hand-written teardown -- this guards against either kind of
      # migration silently failing to reverse.
      - name: Check the migration chain reverses
        working-directory: api
        run: alembic downgrade -1 && alembic upgrade head
      # This job never sets BIDMATE_BID_SET, so the engine regression tests
      # (test_engine_pipeline.py plus the counting and legend regressions --
      # the guards on a defect that once silently zeroed 43 of 45 items on a
      # real drawing set) skip here. That bid set lives outside the repo and
      # committing it is ruled out by bid confidentiality (ROADMAP.md §3.3).
      # BIDMATE_BID_SET is how a runner with a local copy opts in -- see
      # tests/bid_set.py. -rs prints every skip's reason so a green build
      # here does not read as "the engine was checked."
      - name: Run tests
        working-directory: api
        run: pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 is the floor, not a preference: package.json's test script
          # passes --no-experimental-webstorage in NODE_OPTIONS, which Node
          # 20 rejects outright ("not allowed in NODE_OPTIONS"). Verified
          # across majors: 20 fails, 22 and 24 accept it. Declared in
          # package.json's engines field so this constraint is visible to a
          # reader who never opens this file.
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
