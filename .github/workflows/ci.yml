name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: takeoff
          POSTGRES_PASSWORD: takeoff
          POSTGRES_DB: takeoff
        options: >-
          --health-cmd "pg_isready -U takeoff"
          --health-interval 3s --health-timeout 3s --health-retries 20
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql+psycopg://takeoff:takeoff@localhost:5432/takeoff
      TEST_DATABASE_URL: postgresql+psycopg://takeoff:takeoff@localhost:5432/takeoff_test
      BLOB_ENDPOINT: http://localhost:9000
      BLOB_ACCESS_KEY: bidmate
      BLOB_SECRET_KEY: bidmate-dev-secret
      BLOB_BUCKET: bidmate-documents
      BLOB_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # S3 in CI is moto, not MinIO, because every registry route to a
      # MinIO image has closed: the image's entrypoint needs a command so
      # `services:` cannot start it, bitnami/minio went behind a paid
      # Docker Hub subscription in 2025, Docker Hub's minio/minio and
      # minio/mc are gone, and quay.io -- the fallback this workflow used
      # until 2026-09-27 -- now answers an anonymous pull of
      # quay.io/minio/minio with "unauthorized", including for the exact
      # tag pinned here before. moto needs no registry at all: it is a
      # pip install, pinned like any other dependency.
      #
      # What this costs, stated plainly: the S3BlobStore round trip now
      # runs against an S3 mock rather than against MinIO, so it still
      # proves the store's own key handling, streaming, delete and
      # BlobNotFound behaviour but no longer proves MinIO compatibility
      # specifically. Locally that coverage is unchanged -- compose still
      # runs real MinIO and the same test picks it up. The alternative
      # was no S3 coverage in CI at all.
      - name: Start an S3 server
        run: |
          pip install "moto[server]==5.0.28"
          nohup moto_server -p 9000 > "$RUNNER_TEMP/moto.log" 2>&1 &
          # The loop alone could not fail: a server that never came up fell
          # out of it after a minute and the step went green, so the
          # failure surfaced later as a wall of S3 connection errors from
          # the test step rather than here, at the step that caused it.
          for i in $(seq 1 20); do
            if curl -sf http://localhost:9000/ > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "The S3 server did not answer within 60s" >&2
          cat "$RUNNER_TEMP/moto.log" >&2 || true
          exit 1
      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt
      # boto3 is already an api dependency, so the bucket is made with the
      # same client the application uses rather than a second pinned image
      # (quay.io/minio/mc is behind the same wall as the server was).
      - name: Create the documents bucket
        working-directory: api
        run: |
          python - <<'PY'
          import os
          import boto3

          boto3.client(
              "s3",
              endpoint_url=os.environ["BLOB_ENDPOINT"],
              aws_access_key_id=os.environ["BLOB_ACCESS_KEY"],
              aws_secret_access_key=os.environ["BLOB_SECRET_KEY"],
              region_name=os.environ["BLOB_REGION"],
          ).create_bucket(Bucket=os.environ["BLOB_BUCKET"])
          PY
      - name: Run migrations
        working-directory: api
        run: alembic upgrade head
      # Proves the worker loop boots against the CI database and polls
      # until killed -- not a functional test (that's the pytest suite
      # below), just that `python -m app.worker` starts cleanly in this
      # environment. `timeout` sends TERM at 20s; the exit status is 124
      # regardless of how main() handles it, so this doesn't depend on
      # graceful shutdown.
      - name: Smoke-test the worker loop
        working-directory: api
        run: timeout 20 python -m app.worker || [ $? -eq 124 ]
      # 0016 was renamed by hand after being applied, and 0017 is DDL-only
      # with a hand-written teardown -- this guards against either kind of
      # migration silently failing to reverse.
      - name: Check the migration chain reverses
        working-directory: api
        run: alembic downgrade -1 && alembic upgrade head
      # This job never sets BIDMATE_BID_SET, so the engine regression tests
      # (test_engine_pipeline.py plus the counting and legend regressions --
      # the guards on a defect that once silently zeroed 43 of 45 items on a
      # real drawing set) skip here. That bid set lives outside the repo and
      # committing it is ruled out by bid confidentiality (ROADMAP.md §3.3).
      # BIDMATE_BID_SET is how a runner with a local copy opts in -- see
      # tests/bid_set.py. -rs prints every skip's reason so a green build
      # here does not read as "the engine was checked."
      - name: Run tests
        working-directory: api
        run: pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 is the floor, not a preference: package.json's test script
          # passes --no-experimental-webstorage in NODE_OPTIONS, which Node
          # 20 rejects outright ("not allowed in NODE_OPTIONS"). Verified
          # across majors: 20 fails, 22 and 24 accept it. Declared in
          # package.json's engines field so this constraint is visible to a
          # reader who never opens this file.
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
