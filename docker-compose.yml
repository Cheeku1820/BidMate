services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: takeoff
      POSTGRES_PASSWORD: takeoff
      POSTGRES_DB: takeoff
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takeoff"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://takeoff:takeoff@postgres:5432/takeoff
      TEST_DATABASE_URL: postgresql+psycopg://takeoff:takeoff@postgres:5432/takeoff_test
    volumes: ["./api:/srv"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}

  # Port 5174 on the host, not 5173 — 5173 is usually already occupied by
  # an unrelated app on this machine (see README's "Run the full stack").
  # VITE_API_PROXY_TARGET points vite.config.js's dev proxy at the
  # Compose network alias rather than localhost, since Vite runs inside
  # this container, where "localhost" means the container itself, not
  # the `api` service (task-16-brief.md §2).
  web:
    image: node:20-alpine
    working_dir: /srv
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes: ["./:/srv", "/srv/node_modules"]
    ports: ["5174:5173"]
    depends_on: [api]

volumes:
  pgdata:
