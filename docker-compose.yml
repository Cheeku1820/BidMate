services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: takeoff
      POSTGRES_PASSWORD: takeoff
      POSTGRES_DB: takeoff
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takeoff"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Object storage for uploaded documents. The console on 9001 is for
  # looking at what was stored; the API talks to 9000. Credentials here
  # are dev-only and match api/.env.example.
  minio:
    # minio/minio was pulled from Docker Hub in 2025 (MinIO now publishes
    # only to quay.io) -- pulling the Docker Hub name here 404s.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bidmate
      MINIO_ROOT_PASSWORD: bidmate-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: create the bucket, then exit. `mc mb --ignore-existing` makes
  # a second `compose up` a no-op.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 bidmate bidmate-dev-secret
      && mc mb --ignore-existing local/bidmate-documents"

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://takeoff:takeoff@postgres:5432/takeoff
      TEST_DATABASE_URL: postgresql+psycopg://takeoff:takeoff@postgres:5432/takeoff_test
      BLOB_ENDPOINT: http://minio:9000
      BLOB_ACCESS_KEY: bidmate
      BLOB_SECRET_KEY: bidmate-dev-secret
      BLOB_BUCKET: bidmate-documents
      BLOB_REGION: us-east-1
    # ANTHROPIC_API_KEY comes from api/.env (copy api/.env.example), the
    # same file the host-run API reads. The API needs it for the
    # conversation panel; without it the panel says it isn't set up and
    # nothing else is affected. Deliberately not listed under
    # `environment:` -- an entry there, even an empty `${...:-}`, wins over
    # the file and blanks the key. The `path:`/`required:` long syntax
    # needs Compose 2.24 or newer.
    env_file:
      - path: ./api/.env
        required: false
    volumes: ["./api:/srv"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  # The only process that opens a PDF. Same image as the API, a different
  # command, and the resource limits that make a hostile file a
  # one-container problem.
  worker:
    build: ./api
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://takeoff:takeoff@postgres:5432/takeoff
      BLOB_ENDPOINT: http://minio:9000
      BLOB_ACCESS_KEY: bidmate
      BLOB_SECRET_KEY: bidmate-dev-secret
      BLOB_BUCKET: bidmate-documents
      BLOB_REGION: us-east-1
    # Same key source as `api`: api/.env.
    env_file:
      - path: ./api/.env
        required: false
    mem_limit: 2g
    pids_limit: 256
    volumes: ["./api:/srv"]
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  # Port 5174 on the host, not 5173 — 5173 is usually already occupied by
  # an unrelated app on this machine (see README's "Run the full stack").
  # VITE_API_PROXY_TARGET points vite.config.js's dev proxy at the
  # Compose network alias rather than localhost, since Vite runs inside
  # this container, where "localhost" means the container itself, not
  # the `api` service (task-16-brief.md §2).
  web:
    image: node:20-alpine
    working_dir: /srv
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes: ["./:/srv", "/srv/node_modules"]
    ports: ["5174:5173"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
